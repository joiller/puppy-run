services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: puppyrun
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/vps/.env}
      POSTGRES_DB: puppyrun
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U puppyrun -d puppyrun"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      PUPPYRUN_ENV: production
      PUPPYRUN_DATABASE_URL: postgresql+asyncpg://puppyrun:${POSTGRES_PASSWORD_URLENCODED:?set POSTGRES_PASSWORD_URLENCODED in deploy/vps/.env}@postgres:5432/puppyrun
      PUPPYRUN_REDIS_URL: redis://redis:6379/0
      PUPPYRUN_CORS_ORIGINS: ${PUPPYRUN_CORS_ORIGINS:?set PUPPYRUN_CORS_ORIGINS in deploy/vps/.env}
      PUPPYRUN_GITHUB_TOKEN: ${PUPPYRUN_GITHUB_TOKEN:-}
      PUPPYRUN_GITHUB_API_BASE_URL: ${PUPPYRUN_GITHUB_API_BASE_URL:-https://api.github.com}
      PUPPYRUN_LLM_PROVIDER: ${PUPPYRUN_LLM_PROVIDER:-deepseek}
      PUPPYRUN_DEEPSEEK_MODEL: ${PUPPYRUN_DEEPSEEK_MODEL:-deepseek-v4-flash}
      PUPPYRUN_DEEPSEEK_API_KEY: ${PUPPYRUN_DEEPSEEK_API_KEY:-}
      PUPPYRUN_DEEPSEEK_BASE_URL: ${PUPPYRUN_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      PUPPYRUN_DEMO_SAFETY_ENABLED: ${PUPPYRUN_DEMO_SAFETY_ENABLED:-true}
      PUPPYRUN_LIVE_DEMO_ENABLED: ${PUPPYRUN_LIVE_DEMO_ENABLED:-true}
      PUPPYRUN_ADMIN_TOKEN: ${PUPPYRUN_ADMIN_TOKEN:-}
      PUPPYRUN_LIVE_RUN_DAILY_LIMIT: ${PUPPYRUN_LIVE_RUN_DAILY_LIMIT:-20}
      PUPPYRUN_LIVE_RUN_DAILY_LIMIT_PER_IP: ${PUPPYRUN_LIVE_RUN_DAILY_LIMIT_PER_IP:-3}
      PUPPYRUN_SESSION_CREATE_DAILY_LIMIT_PER_IP: ${PUPPYRUN_SESSION_CREATE_DAILY_LIMIT_PER_IP:-10}
      PUPPYRUN_READ_RATE_LIMIT_PER_MINUTE_PER_IP: ${PUPPYRUN_READ_RATE_LIMIT_PER_MINUTE_PER_IP:-120}
      PUPPYRUN_CLIENT_IP_HEADER: ${PUPPYRUN_CLIENT_IP_HEADER:-X-Forwarded-For}
    command: sh -c "alembic upgrade head && uvicorn puppyrun_api.main:app --host 0.0.0.0 --port 8000"
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../../backend
    restart: unless-stopped
    environment:
      PUPPYRUN_ENV: production
      PUPPYRUN_DATABASE_URL: postgresql+asyncpg://puppyrun:${POSTGRES_PASSWORD_URLENCODED:?set POSTGRES_PASSWORD_URLENCODED in deploy/vps/.env}@postgres:5432/puppyrun
      PUPPYRUN_REDIS_URL: redis://redis:6379/0
      PUPPYRUN_GITHUB_TOKEN: ${PUPPYRUN_GITHUB_TOKEN:-}
      PUPPYRUN_GITHUB_API_BASE_URL: ${PUPPYRUN_GITHUB_API_BASE_URL:-https://api.github.com}
      PUPPYRUN_LLM_PROVIDER: ${PUPPYRUN_LLM_PROVIDER:-deepseek}
      PUPPYRUN_DEEPSEEK_MODEL: ${PUPPYRUN_DEEPSEEK_MODEL:-deepseek-v4-flash}
      PUPPYRUN_DEEPSEEK_API_KEY: ${PUPPYRUN_DEEPSEEK_API_KEY:-}
      PUPPYRUN_DEEPSEEK_BASE_URL: ${PUPPYRUN_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      PUPPYRUN_DEMO_SAFETY_ENABLED: ${PUPPYRUN_DEMO_SAFETY_ENABLED:-true}
      PUPPYRUN_LIVE_DEMO_ENABLED: ${PUPPYRUN_LIVE_DEMO_ENABLED:-true}
      PUPPYRUN_ADMIN_TOKEN: ${PUPPYRUN_ADMIN_TOKEN:-}
      PUPPYRUN_LIVE_RUN_DAILY_LIMIT: ${PUPPYRUN_LIVE_RUN_DAILY_LIMIT:-20}
      PUPPYRUN_LIVE_RUN_DAILY_LIMIT_PER_IP: ${PUPPYRUN_LIVE_RUN_DAILY_LIMIT_PER_IP:-3}
      PUPPYRUN_SESSION_CREATE_DAILY_LIMIT_PER_IP: ${PUPPYRUN_SESSION_CREATE_DAILY_LIMIT_PER_IP:-10}
      PUPPYRUN_READ_RATE_LIMIT_PER_MINUTE_PER_IP: ${PUPPYRUN_READ_RATE_LIMIT_PER_MINUTE_PER_IP:-120}
      PUPPYRUN_CLIENT_IP_HEADER: ${PUPPYRUN_CLIENT_IP_HEADER:-X-Forwarded-For}
    command: arq puppyrun_worker.main.WorkerSettings
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/vps/web.Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    environment:
      PUPPYRUN_PUBLIC_HOST: ${PUPPYRUN_PUBLIC_HOST:?set PUPPYRUN_PUBLIC_HOST in deploy/vps/.env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
